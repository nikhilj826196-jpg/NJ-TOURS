version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nj_tours_db
    restart: always
    environment:
      MYSQL_DATABASE: nj_tours
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nj_network

  redis:
    image: redis:7-alpine
    container_name: nj_tours_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nj_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nj_tours_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+aiomysql://root:password@db:3306/nj_tours
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - uploads_volume:/app/uploads
    networks:
      - nj_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nj_tours_celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      - DATABASE_URL=mysql+aiomysql://root:password@db:3306/nj_tours
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
    volumes:
      - uploads_volume:/app/uploads
    networks:
      - nj_network

  nginx:
    image: nginx:alpine
    container_name: nj_tours_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - uploads_volume:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - nj_network

  prometheus:
    image: prom/prometheus:latest
    container_name: nj_tours_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nj_network

  grafana:
    image: grafana/grafana:latest
    container_name: nj_tours_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nj_network

networks:
  nj_network:
    driver: bridge

volumes:
  mysql_data:
  uploads_volume:
  prometheus_data:
  grafana_data:
